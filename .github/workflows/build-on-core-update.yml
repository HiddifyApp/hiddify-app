name: Sync upstream and build personal release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      release-current:
        description: Build and release the latest stable core now, even if it was already built
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: personal-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Merging upstream changes to .github/workflows needs a token with the workflow scope
      # (SYNC_TOKEN); GITHUB_TOKEN can never push them.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.release-current }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hiddify/hiddify-app.git
          git fetch upstream main
          upstream_updated=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            echo "Merging upstream app commit $(git rev-parse --short upstream/main)."
            if ! git merge --no-edit upstream/main; then
              git merge --abort || true
              echo "Upstream merge conflicts with the personal fork. Resolve them on main; no files were overwritten." >&2
              exit 1
            fi
            if ! git push origin HEAD:main; then
              if git diff --name-only HEAD@{1} HEAD | grep -q '^\.github/workflows/'; then
                echo "::error::Upstream changed .github/workflows, which GITHUB_TOKEN may not push. Add a SYNC_TOKEN secret: a token with the repo and workflow scopes." >&2
              fi
              exit 1
            fi
            upstream_updated=true
          fi
          source_ref="$(git rev-parse HEAD)"

          core_tag="$(gh api repos/hiddify/hiddify-core/releases/latest --jq .tag_name)"
          core_version="${core_tag#v}"
          if [[ ! "$core_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported hiddify-core release tag: $core_tag" >&2
            exit 1
          fi

          last_built_core="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].body // ""' | grep -oE '<!-- hiddify-core-version: [0-9]+\.[0-9]+\.[0-9]+ -->' | sed -E 's/.*: ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/' | sort -V | tail -n 1 || true)"
          baseline="${last_built_core:-$(sed -n 's/^core\.version=//p' dependencies.properties | head -n 1)}"
          newest="$(printf '%s\n%s\n' "$core_version" "$baseline" | sort -V | tail -n 1)"
          core_updated=false
          if [[ "$newest" == "$core_version" && "$core_version" != "$baseline" ]]; then
            core_updated=true
          fi
          if [[ "$FORCE_BUILD" != 'true' && "$upstream_updated" != 'true' && "$core_updated" != 'true' ]]; then
            echo "No upstream app or hiddify-core update (app=$source_ref, core=$core_version)."
            exit 0
          fi

          current_app_version="$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml | head -n 1)"
          latest_app_version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | ltrimstr("v")' | sort -V | tail -n 1)"
          app_version="$(python3 .github/scripts/next_release_version.py "$current_app_version" "$core_version" "$latest_app_version")"
          echo "Building app $app_version from $source_ref with hiddify-core $core_version (upstream app update: $upstream_updated)."

          # The release commit carries the version; only its tag is pushed, so main keeps
          # upstream's version line and the next merge does not conflict on it.
          python3 .github/scripts/apply_release_versions.py "$core_version" "$app_version"
          git commit -qam "release: personal version $app_version" --allow-empty
          git tag -f "v$app_version"
          git push -f origin "refs/tags/v$app_version"

          # personal-build.yml builds that commit: the platform workflows check out the run's ref.
          gh workflow run personal-build.yml --ref "v$app_version" \
            -f app-version="$app_version" -f core-version="$core_version"
          echo "Started personal-build.yml for v$app_version: https://github.com/$GITHUB_REPOSITORY/actions/workflows/personal-build.yml"
